name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP file Flutter'
        required: true
        type: string
      app_name:
        description: 'Nama Aplikasi'
        required: true
        type: string
      user_id:
        description: 'Telegram User ID'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'
    
    - name: Setup Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-11076708_latest.zip -d cmdline-tools
        mkdir -p android-sdk/cmdline-tools
        mv cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
        export ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/android-sdk
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
    
    - name: Download ZIP
      run: |
        curl -L -o project.zip "${{ github.event.inputs.zip_url }}"
        unzip project.zip -d project
        echo "Extracted files:"
        ls -la project/
        PROJECT_ROOT=$(find project -name "pubspec.yaml" -type f | head -1 | xargs dirname)
        echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
        echo "Project root: $PROJECT_ROOT"
    
    - name: Build APK
      run: |
        cd $PROJECT_ROOT
        flutter clean
        flutter pub get
        flutter build apk --release
    
    - name: Send APK to Telegram
      if: success()
      run: |
        APK_PATH=$(find $PROJECT_ROOT/build/app/outputs/flutter-apk -name "*.apk" | head -1)
        APK_NAME=$(basename "$APK_PATH")
        APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
        
        curl -F "chat_id=${{ github.event.inputs.user_id }}" \
             -F "document=@$APK_PATH" \
             -F "caption=✅ *Build Berhasil!*\n\n📦 Nama: ${{ github.event.inputs.app_name }}\n📲 APK: $APK_NAME\n📦 Ukuran: $APK_SIZE\n⏱️ Waktu: $(date '+%Y-%m-%d %H:%M:%S')" \
             "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendDocument"
    
    - name: Send Error Notification
      if: failure()
      run: |
        curl -F "chat_id=${{ github.event.inputs.user_id }}" \
             -F "text=❌ *Build Gagal!*\n\n📦 Nama: ${{ github.event.inputs.app_name }}\n\nSilakan cek log GitHub Actions untuk detail error." \
             "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage"
