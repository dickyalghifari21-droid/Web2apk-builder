name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL download ZIP project (GitHub Release asset)'
        required: true
      tag:
        description: 'Job ID / tag unik untuk build ini'
        required: true
      build_type:
        description: 'Tipe build (release/debug)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      only_analyze:
        description: 'Mode analyze only (true/false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      chat_id:
        description: 'Telegram chat_id (opsional, dikirim otomatis oleh bot)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Download ZIP project
        run: |
          set +e
          {
            curl -sS -L \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              "${{ github.event.inputs.zip_url }}" \
              -o project.zip
          } 2>&1 | tee download.log
          exit ${PIPESTATUS[0]}

      - name: Validate downloaded ZIP
        run: |
          FTYPE=$(file --mime-type -b project.zip)
          if [ "$FTYPE" != "application/zip" ]; then
            echo "❌ File yang terdownload bukan ZIP (mime: $FTYPE). Cek apakah zip_url valid/masih berlaku." | tee -a download.log
            exit 1
          fi

      - name: Extract ZIP project
        run: |
          set +e
          {
            mkdir -p myapp
            unzip -q project.zip -d myapp_extracted

            if [ -f "myapp_extracted/pubspec.yaml" ]; then
              mv myapp_extracted/* myapp/
            else
              INNER=$(find myapp_extracted -maxdepth 1 -mindepth 1 -type d | head -n 1)
              if [ -n "$INNER" ] && [ -f "$INNER/pubspec.yaml" ]; then
                mv "$INNER"/* myapp/
              else
                echo "❌ Tidak ditemukan pubspec.yaml di dalam ZIP. Pastikan ZIP berisi project Flutter yang valid (bukan project Node.js/lainnya)."
                exit 1
              fi
            fi
          } 2>&1 | tee extract.log
          exit ${PIPESTATUS[0]}

      - name: Flutter pub get
        working-directory: myapp
        run: |
          set +e
          flutter pub get 2>&1 | tee ../pubget.log
          exit ${PIPESTATUS[0]}

      - name: Flutter Analyze
        if: github.event.inputs.only_analyze == 'true'
        working-directory: myapp
        run: |
          set +e
          flutter analyze 2>&1 | tee ../analyze.log
          exit ${PIPESTATUS[0]}

      - name: Build APK
        if: github.event.inputs.only_analyze != 'true'
        working-directory: myapp
        run: |
          set +e
          if [ "${{ github.event.inputs.build_type }}" == "debug" ]; then
            flutter build apk --debug 2>&1 | tee ../build.log
          else
            flutter build apk --release 2>&1 | tee ../build.log
          fi
          exit ${PIPESTATUS[0]}

      - name: Upload APK artifact
        if: success() && github.event.inputs.only_analyze != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.tag }}
          path: myapp/build/app/outputs/flutter-apk/*.apk
          retention-days: 1

      # ============================================================
      # Kalau ADA step di atas yang gagal, kumpulkan log jadi 1 file
      # ringkas dan upload sebagai artifact "error-log-<tag>".
      # handleBuildFailure() di buildHandler.js SUDAH mencari artifact
      # dengan nama mengandung "error-log" — jadi ini yang bikin
      # laporan error di Telegram nggak lagi "unknown" / kosong.
      # ============================================================
      - name: Generate error summary
        if: failure()
        run: |
          mkdir -p error-artifact
          {
            echo "=== DOWNLOAD ZIP LOG (tail) ==="
            tail -n 40 download.log 2>/dev/null || echo "(tidak ada log)"
            echo ""
            echo "=== EXTRACT ZIP LOG (tail) ==="
            tail -n 40 extract.log 2>/dev/null || echo "(tidak ada log)"
            echo ""
            echo "=== FLUTTER PUB GET LOG (tail) ==="
            tail -n 80 pubget.log 2>/dev/null || echo "(tidak ada log)"
            echo ""
            echo "=== FLUTTER ANALYZE LOG (tail) ==="
            tail -n 80 analyze.log 2>/dev/null || echo "(tidak ada log)"
            echo ""
            echo "=== FLUTTER BUILD LOG (tail) ==="
            tail -n 150 build.log 2>/dev/null || echo "(tidak ada log)"
          } > error-artifact/error_summary.txt

      - name: Upload error log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log-${{ github.event.inputs.tag }}
          path: error-artifact/error_summary.txt
          retention-days: 1
